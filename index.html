<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Practice App</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:Arial,Helvetica,sans-serif;
    height:100vh;
}

/* COMMON */
.page{
    display:none;
    width:100%;
    height:100vh;
}

/* ================= EDITOR PAGE ================= */
#editorPage{
    display:flex;
    flex-direction:column;
    background:#111;
    color:#fff;
}

.header{
    padding:15px;
    text-align:center;
    background:#000;
}

textarea{
    flex:1;
    width:100%;
    border:none;
    outline:none;
    resize:none;
    padding:20px;
    font-family:monospace;
    font-size:15px;
    background:#0d0d0d;
    color:#00ff88;
}

.editor-footer{
    padding:15px;
    text-align:center;
    background:#000;
}

button{
    padding:14px 30px;
    font-size:16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.run-btn{
    background:#00c853;
    color:#000;
    font-weight:bold;
}

/* ================= OUTPUT PAGE ================= */
#outputPage{
    background:#fff;
    display:flex;
    flex-direction:column;
}

.output-header{
    background:#1e3c72;
    color:#fff;
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.back-btn{
    background:#ff5252;
    color:#fff;
}

iframe{
    flex:1;
    border:none;
}
</style>
</head>

<body>

<!-- ========= EDITOR PAGE ========= -->
<div id="editorPage" class="page">
    <div class="header">
        <h2>HTML Code Editor</h2>
        <p>Buid your experience with @ankitcreatioms</p>
    </div>

<textarea id="code">
<!DOCTYPE html>
<html>
<head>
  <title>Test</title>
</head>
<body>
  <h1>Hello Dear this is Ankit🚀</h1>
  <p>By ankitcreations</p>
</body>
</html>
</textarea>

    <div class="editor-footer">
        <button class="run-btn" onclick="runCode()">▶ RUN CODE</button>
    </div>
</div>

<!-- ========= OUTPUT PAGE ========= -->
<div id="outputPage" class="page">
    <div class="output-header">
        <span>HTML Output</span>
        <button class="back-btn" onclick="backToEditor()">⬅ Back</button>
    </div>

    <iframe id="outputFrame"></iframe>
</div>

<script>
const editorPage = document.getElementById("editorPage");
const outputPage = document.getElementById("outputPage");
const iframe = document.getElementById("outputFrame");
const codeBox = document.getElementById("code");

/* Start with editor */
editorPage.style.display = "flex";

/* RUN */
function runCode(){
    const code = codeBox.value.trim();
    if(!code){
        alert("Code likho pehle!");
        return;
    }

    iframe.srcdoc = code;   // 🔥 ACTUAL RUN HERE
    editorPage.style.display = "none";
    outputPage.style.display = "flex";
}

/* BACK */
function backToEditor(){
    outputPage.style.display = "none";
    editorPage.style.display = "flex";
}
</script>
<footer>
© 2026 Ankit Jha • All Rights Reserved
</footer>
</body>
</html>
